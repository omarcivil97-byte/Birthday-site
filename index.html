<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأة عيد ميلاد 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#2c3e50,#00c6ff);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.card{
    background:rgba(255, 255, 255, 0.1);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:450px;
    box-shadow:0 8px 32px 0 rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    z-index:10;
    position: relative;
    overflow: hidden;
    transition: background 1.5s ease;
}

/* طبقة الصورة الخلفية الشفافة للكارت */
.card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    background-image: url('nour.jpg');
    background-size: cover;
    background-position: center;
    opacity: 0;
    z-index: -1;
    transition: opacity 1.5s ease;
}

.card.show-bg::before {
    opacity: 0.25;
}

.card.show-bg {
    background: rgba(0, 0, 0, 0.5);
}

/* تأثير اهتزاز الشاشة */
.shake {
    animation: shakeEffect 0.5s ease-in-out;
}

@keyframes shakeEffect {
    0%, 100% { transform: translateX(0) translateY(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) translateY(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(8px) translateY(5px); }
}

h1{
    margin-bottom:15px;
    font-size: 28px;
}

h2 {
    margin-top: 10px;
    color: #ffd700;
}

input{
    width:100%;
    padding:14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius:12px;
    font-size:18px;
    margin-top:20px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    text-align: center;
    outline: none;
    transition: 0.3s;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

input:focus {
    border-color: #ffd700;
    background: rgba(255, 255, 255, 0.3);
}

button{
    margin-top:20px;
    padding:12px 35px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight: bold;
    cursor:pointer;
    background: #ffd700;
    color: #2c3e50;
    transition: transform 0.2s, background 0.3s;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    position: relative;
    z-index: 12;
}

button:hover {
    transform: scale(1.05);
    background: #fff;
}

button:active {
    transform: scale(0.95);
}

#intermediate-page, #countdown-box, #content {
    display: none;
}

#countdown-box {
    font-size: 90px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0px 0px 20px rgba(255, 215, 0, 0.8);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

#intermediate-page, #content {
    animation: show 1.2s ease forwards;
}

@keyframes show{
    from{opacity:0; transform:scale(.85);}
    to{opacity:1; transform:scale(1);}
}

.star{
    position:absolute;
    width:4px;
    height:4px;
    background:white;
    border-radius:50%;
    animation:fall linear infinite;
    pointer-events: none;
}

@keyframes fall{
    from{ transform:translateY(-10vh); opacity:1; }
    to{ transform:translateY(110vh); opacity:0; }
}

.confetti-piece {
    position: absolute;
    font-size: 32px;
    pointer-events: none;
    animation: drop 3s linear forwards;
    z-index: 9;
}

@keyframes drop {
    0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
}

.burst-piece {
    position: absolute;
    font-size: 35px;
    pointer-events: none;
    z-index: 99;
    animation: explode 1.5s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
}

@keyframes explode {
    0% { transform: translate(0, 0) scale(1); opacity: 1; }
    100% { transform: translate(var(--x), var(--y)) rotate(var(--r)) scale(0.5); opacity: 0; }
}

/* مؤشر الكتابة الوامض */
.typed-text::after {
    content: '|';
    animation: blink 0.7s infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
}
</style>
</head>

<body>

<audio id="bg-music" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" loop></audio>

<div class="card" id="main-card">

    <div id="login">
        <h1>🎁 لديكِ مفاجأة خاصة</h1>
        <p>أدخلي كلمة السر لفتحها <br> <small style="color: #ffd700;">ملاحظة: ( شغلي تركيزج شوية وراح تعرفين الرمز )</small></p>
        
        <input type="password" id="password" placeholder="كلمة السر">
        <br>
        <button onclick="checkPassword()">فتح المفاجأة</button>
        
        <p id="error" style="margin-top:15px; font-weight: bold; color:#ffcbd1; line-height: 1.4;"></p>
    </div>

    <div id="intermediate-page">
        <h1 style="font-size: 24px; line-height: 1.5; color: #ffd700;"> هرمنا من اجل هذه اللحظة مبرووك ال28 هي سنتج الجديدة !</h1>
        <p style="font-size: 20px; line-height: 1.6; margin-top: 15px;">
            جيد تركيز لا بأس به ما دام وصلتي لهاي النقطة تستحقين المعايدة 😉✨
        </p>
        <button onclick="startCountdown()">انتقال إلى المعايدة 🚀</button>
    </div>

    <div id="countdown-box">3</div>

    <div id="content">
        <h1 id="line1" class="typed-text"></h1>
        <h2 id="line2"></h2>
        <p id="line3" style="margin-top:15px; font-size:20px; line-height: 1.6; min-height: 50px;"></p>
        <p id="line4" style="margin-top:15px; font-size:18px; font-weight: bold; color: #ffd700; min-height: 30px;"></p>
    </div>

</div>

<script>
const secret = "28";
let rainInterval;
// متغير لحساب عدد المحاولات الخاطئة
let wrongAttempts = 0;

const text1 = "🎉 عيد ميلاد سعيد 🎉";
const text2 = "كل عام وأنتِ بألف خير نــور";
const text3 = "أتمنى لكِ السعادة والنجاح وتحقيق كل أحلامكِ. ✨";
const text4 = "Best wishes-10-6-2026";

document.getElementById("password").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        checkPassword();
    }
});

function checkPassword(){
    let pass = document.getElementById("password").value;
    if(pass === secret){
        document.getElementById("login").style.display = "none";
        document.getElementById("intermediate-page").style.display = "block";
    } else {
        // زيادة عدد الأخطاء بمقدار 1 في كل مرة تكتب خطأ
        wrongAttempts++;
        let errorElement = document.getElementById("error");
        
        // تبديل الرسالة بناءً على عدد الأخطاء
        if (wrongAttempts === 1) {
            errorElement.innerHTML = "❌ مع الأسف على تركيزج.. انصحج بالشطرنج 🌝";
        } else if (wrongAttempts === 2) {
            errorElement.innerHTML = "❌ له له له معلسف ركزي شوية 🤦‍♂️";
        } else if (wrongAttempts === 3) {
            errorElement.innerHTML = "❌ لا تلحين باقي ثلاث محاولات وتنلغي المفاجأة 🤫";
        } else {
            errorElement.innerHTML = "❌ تحياتي باقي محاولتين اذا ايستي اسالي 🫡";
        }
    }
}

function startCountdown() {
    document.getElementById("intermediate-page").style.display = "none";
    const countdownBox = document.getElementById("countdown-box");
    countdownBox.style.display = "block";
    
    rainInterval = setInterval(createConfetti, 80);
    
    let timeLeft = 3;
    let timer = setInterval(function() {
        timeLeft--;
        if (timeLeft > 0) {
            countdownBox.innerText = timeLeft;
        } else {
            clearInterval(timer);
            countdownBox.style.display = "none";
            
            triggerExplosion(); 
            
            document.getElementById("main-card").classList.add("show-bg");
            document.getElementById("content").style.display = "block";
            
            clearInterval(rainInterval);
            rainInterval = setInterval(createConfetti, 250);
            
            typeLine(document.getElementById("line1"), text1, () => {
                document.getElementById("line1").classList.remove("typed-text");
                document.getElementById("line2").classList.add("typed-text");
                
                typeLine(document.getElementById("line2"), text2, () => {
                    document.getElementById("line2").classList.remove("typed-text");
                    document.getElementById("line3").classList.add("typed-text");
                    
                    typeLine(document.getElementById("line3"), text3, () => {
                        document.getElementById("line3").classList.remove("typed-text");
                        document.getElementById("line4").classList.add("typed-text");
                        
                        typeLine(document.getElementById("line4"), text4, () => {
                            document.getElementById("line4").classList.remove("typed-text");
                        });
                    });
                });
            });
        }
    }, 1000);
}

function typeLine(element, text, callback) {
    let index = 0;
    let timer = setInterval(() => {
        if (index < text.length) {
            element.innerHTML += text.charAt(index);
            index++;
        } else {
            clearInterval(timer);
            if (callback) callback();
        }
    }, 90);
}

function triggerExplosion() {
    const music = document.getElementById("bg-music");
    music.play().catch(e => console.log("Audio play blocked"));

    const card = document.getElementById("main-card");
    card.classList.add("shake");
    setTimeout(() => card.classList.remove("shake"), 500);

    const emojis = ["🎉", "✨", "💥", "🎈", "🎂", "💖", "🥳"];
    for (let i = 0; i < 70; i++) {
        let p = document.createElement("div");
        p.className = "burst-piece";
        p.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
        p.style.left = "50vw";
        p.style.top = "50vh";
        
        const angle = Math.random() * Math.PI * 2;
        const velocity = Math.random() * 300 + 150;
        const x = Math.cos(angle) * velocity + "px";
        const y = Math.sin(angle) * velocity + "px";
        const r = Math.random() * 360 + "deg";
        
        p.style.setProperty('--x', x);
        p.style.setProperty('--y', y);
        p.style.setProperty('--r', r);
        
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 1500);
    }
}

for(let i=0; i<80; i++){
    let s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random()*100 + "vw";
    s.style.animationDuration = (Math.random()*4 + 3) + "s";
    s.style.animationDelay = Math.random()*5 + "s";
    document.body.appendChild(s);
}

function createConfetti(){
    const emojis = ["🎉", "🎂", "🎈", "✨", "🎁", "💖", "🥳", "🧁"];
    let c = document.createElement("div");
    c.className = "confetti-piece";
    c.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + "vw";
    c.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
}
</script>

</body>
</html>
