<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأة عيد ميلاد 🎉</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
overflow:hidden;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff0080,#7928ca,#2c3e50,#00c6ff);
background-size:400% 400%;
animation:bg 12s ease infinite;
color:white;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.card{
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);
padding:30px;
border-radius:20px;
text-align:center;
width:90%;
max-width:500px;
box-shadow:0 0 25px rgba(255,255,255,.3);
z-index:10;
}

h1{
margin-bottom:15px;
}

input{
width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:18px;
margin-top:10px;
}

button{
margin-top:15px;
padding:12px 25px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

#content{
display:none;
animation:show 1.5s;
}

@keyframes show{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

img{
width:100%;
max-width:350px;
border-radius:15px;
margin-top:15px;
}

.star{
position:absolute;
width:4px;
height:4px;
background:white;
border-radius:50%;
animation:fall linear infinite;
}

@keyframes fall{
from{
transform:translateY(-100vh);
opacity:1;
}
to{
transform:translateY(100vh);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<div id="login">
<h1>🎁 لديك مفاجأة خاصة </h1>
<p>أدخل كلمة السر لفتحها ملاحظة ( شغلي تركيزج شوية )</p>

<input type="password" id="password" placeholder="كلمة السر">

<button onclick="openGift()">فتح المفاجأة</button>

<p id="error" style="margin-top:10px;color:#ffb3b3;"></p>
</div>

<div id="content">
<h1>🎉 عيد ميلاد سعيد 🎉</h1>

<h2>كل عام وأنت بألف خير نــور</h2>

<p style="margin-top:15px;font-size:20px;">
أتمنى لك السعادة والنجاح وتحقيق كل أحلامك.
</p>

<img src="ضع_رابط_الصورة_هنا">

</div>

</div>

<script>

const secret="28";

function openGift(){

let pass=document.getElementById("password").value;

if(pass===secret){

document.getElementById("login").style.display="none";
document.getElementById("content").style.display="block";

confetti();

}else{

document.getElementById("error").innerHTML="❌ مع الاسف على تركيزج انصحج بالشطرنج 🌝";

}
}

for(let i=0;i<80;i++){

let s=document.createElement("div");

s.className="star";

s.style.left=Math.random()*100+"vw";

s.style.animationDuration=
(Math.random()*4+3)+"s";

s.style.animationDelay=
Math.random()*5+"s";

document.body.appendChild(s);
}

function confetti(){

for(let i=0;i<100;i++){

let c=document.createElement("div");

c.innerHTML="🎉";

c.style.position="absolute";
c.style.left=Math.random()*100+"vw";
c.style.top="-50px";
c.style.fontSize="30px";

document.body.appendChild(c);

c.animate([
{transform:"translateY(0px)"},
{transform:"translateY(110vh)"}
],
{
duration:3000+Math.random()*2000
});

}
}

</script>

</body>
</html>
