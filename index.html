<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مفاجأة عيد ميلاد 🎉</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body{
    overflow:hidden;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#ff0080,#7928ca,#2c3e50,#00c6ff);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.card{
    background:rgba(255, 255, 255, 0.1);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding:40px 30px;
    border-radius:25px;
    text-align:center;
    width:90%;
    max-width:450px;
    box-shadow:0 8px 32px 0 rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.2);
    z-index:10;
}

/* تأثير اهتزاز الشاشة */
.shake {
    animation: shakeEffect 0.5s ease-in-out;
}

@keyframes shakeEffect {
    0%, 100% { transform: translateX(0) translateY(0); }
    10%, 30%, 50%, 70%, 90% { transform: translateX(-8px) translateY(-5px); }
    20%, 40%, 60%, 80% { transform: translateX(8px) translateY(5px); }
}

h1{
    margin-bottom:15px;
    font-size: 28px;
}

h2 {
    margin-top: 10px;
    color: #ffd700;
}

input{
    width:100%;
    padding:14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-radius:12px;
    font-size:18px;
    margin-top:20px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    text-align: center;
    outline: none;
    transition: 0.3s;
}

input::placeholder {
    color: rgba(255, 255, 255, 0.7);
}

input:focus {
    border-color: #ffd700;
    background: rgba(255, 255, 255, 0.3);
}

button{
    margin-top:20px;
    padding:12px 35px;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight: bold;
    cursor:pointer;
    background: #ffd700;
    color: #2c3e50;
    transition: transform 0.2s, background 0.3s;
    box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
}

button:hover {
    transform: scale(1.05);
    background: #fff;
}

button:active {
    transform: scale(0.95);
}

#intermediate-page, #countdown-box, #content {
    display: none;
}

#countdown-box {
    font-size: 90px;
    font-weight: bold;
    color: #ffd700;
    text-shadow: 0px 0px 20px rgba(255, 215, 0, 0.8);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.8; }
    100% { transform: scale(1); opacity: 1; }
}

#intermediate-page, #content {
    animation: show 1.2s ease forwards;
}

@keyframes show{
